<!doctype html>
<!-- Ekran goruntusu duzenegi: uygulamayi (www/) misafir modunda 390x844 cerceve icinde acar, verilen adimlari tiklar.
     Yalnizca gelistirme icin; uygulamaya girmez. Kullanim: dev/ekran/cek.sh
     Parametreler: t=dark|light  ui=tr|en  xp=<bugunku XP>  steps=<id ya da css secici>,... (tap:<id> = dokunma olayi)  gap=<adimlar arasi ms, varsayilan 700> -->
<meta charset="utf-8">
<style>html,body{margin:0;background:#000}iframe{display:block;margin:0 auto;border:0;width:390px;height:844px}</style>
<iframe id="f"></iframe>
<script>
(function () {
  var q = new URLSearchParams(location.search), d = new Date(), p = function (n) { return String(n).padStart(2, "0"); };
  var today = d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate()), xp = Number(q.get("xp")) || 0;
  Object.keys(localStorage).forEach(function (k) { if (k.indexOf("cv-") === 0) localStorage.removeItem(k); });
  var en = q.get("ui") === "en";       // Ingilizce arayuzde ornek cift: Ispanyolca -> Ingilizce
  var set = { guest: "1", how: "1", src: en ? "es" : "en", dst: en ? "en" : "tr", ui: q.get("ui") || "tr", theme: q.get("t") === "light" ? "light" : "dark", snd: "0", voice: "0" };
  if (xp) set.demo = JSON.stringify({ xp: xp + 400, d: today, today: xp, ok: { "fısıldamak": 3, "söz": 3, "sır": 3 }, known: [] });
  if (q.get("giris") === "1") { delete set.guest; delete set.how; delete set.demo; }      // hic girilmemis telefon: karsilama ekrani
  Object.keys(set).forEach(function (k) { localStorage.setItem("cv-" + k, set[k]); });
  if (q.get("w")) { document.getElementById("f").style.width = q.get("w") + "px"; document.getElementById("f").style.height = q.get("h") + "px"; }      // magaza goruntuleri icin baska boyut
  var f = document.getElementById("f"), steps = (q.get("steps") || "").split(",").filter(Boolean);
  f.addEventListener("load", function () {
    var doc = f.contentDocument, i = 0;
    (function next() {
      if (i >= steps.length) { document.title = "hazir"; return; }
      var s = steps[i++], tap = s.indexOf("tap:") === 0, id = tap ? s.slice(4) : s, n = null;
      try { n = doc.getElementById(id) || doc.querySelector(id); } catch (e) {}      // "show:..." gecerli bir secici degil
      if (s === "wait") { /* yalnizca bekle: uygulama acilisini bitirsin */ }
      else if (s.indexOf("show:") === 0) {          // hesap isteyen ekranlar: veri olmadan yalnizca yerlesimi gosterir
        doc.querySelectorAll("main section").forEach(function (x) { x.hidden = x.id !== s.slice(5); }); doc.getElementById("main").scrollTop = 0;
      } else if (s.indexOf("unhide:") === 0) { var u = doc.getElementById(s.slice(7)); if (u) u.hidden = false; }
      else if (s.indexOf("hide:") === 0) { var h = doc.getElementById(s.slice(5)); if (h) h.hidden = true; }
      else if (!n) console.error("adim bulunamadi: " + s);
      else if (tap) { ["pointerdown", "pointerup"].forEach(function (e) { n.dispatchEvent(new f.contentWindow.PointerEvent(e, { bubbles: true, clientX: 100, clientY: 300, pointerId: 1 })); }); }   // surukleme dinleyen kartlar icin
      else n.click();
      setTimeout(next, Number(q.get("gap")) || 700);
    })();
  });
  f.src = "../../www/index.html";
})();
</script>
