<meta charset="utf-8">
<style>
@font-face { font-family: "Big Shoulders"; src: url("../../www/fonts/bigshoulders-latin.woff2") format("woff2"); font-weight: 600 800; }
@font-face { font-family: "Big Shoulders"; src: url("../../www/fonts/bigshoulders-latin-ext.woff2") format("woff2"); font-weight: 600 800; unicode-range: U+0100-02BA; }
@font-face { font-family: "Instrument Sans"; src: url("../../www/fonts/instrumentsans-latin.woff2") format("woff2"); font-weight: 400 700; }
@font-face { font-family: "Instrument Sans"; src: url("../../www/fonts/instrumentsans-latin-ext.woff2") format("woff2"); font-weight: 400 700; unicode-range: U+0100-02BA; }
html, body { margin: 0; width: 1024px; height: 500px; overflow: hidden; background: #170E12; color: #F3E9D2; font-family: "Instrument Sans", sans-serif; }
.wrap { display: grid; grid-template-columns: 1fr 440px; gap: 40px; height: 100%; padding: 0 56px; align-items: center; }
.brand { display: flex; align-items: center; gap: 14px; font: 800 34px/1 "Big Shoulders"; }
.logo { position: relative; width: 66px; height: 46px; transform: rotate(-6deg); } .logo svg { width: 100%; height: 100%; fill: #FFD21E; }
.logo b { position: absolute; inset: 0; display: grid; place-items: center; font: 800 25px/1 "Big Shoulders"; color: #170E12; }
h1 { margin: 26px 0 0; font: 800 64px/.96 "Big Shoulders"; letter-spacing: .005em; }
p { margin: 18px 0 0; font-size: 21px; color: #AC9C92; }
.frame { position: relative; aspect-ratio: 1.5 / 1; border-radius: 8px; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 10px; padding: 0 22px 30px;
  background: radial-gradient(120% 90% at 78% 20%, #5B2330 0, #2A1219 45%, #0C0608 100%); }
.sub { font-weight: 700; font-size: 30px; line-height: 1.2; color: #fff; text-align: center; text-shadow: 0 1px 0 #000, 0 0 10px rgba(0,0,0,.9); }
.sub mark { background: none; color: #FFD21E; text-decoration: underline; text-decoration-thickness: 3px; text-underline-offset: 6px; }
.tr { padding: 6px 14px; background: #FFD21E; color: #170E12; border-radius: 5px; font-weight: 700; font-size: 22px; }
</style>
<div class="wrap">
  <div>
    <div class="brand"><span class="logo"><svg viewBox="0 0 40 28"><path d="M3 1h34a2 2 0 0 1 2 2v7a4 4 0 0 0 0 8v7a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2v-7a4 4 0 0 0 0-8V3a2 2 0 0 1 2-2z"/></svg><b>Cv</b></span>CineVocab</div>
    <h1 id="h"></h1><p id="p"></p>
  </div>
  <div class="frame"><div class="sub" id="s"></div><div class="tr" id="t"></div></div>
</div>
<script>
  var tr = new URLSearchParams(location.search).get("l") !== "en";
  document.getElementById("h").textContent = tr ? "İzlediğin dizinin kelimelerini öğren." : "Learn the words from what you watch.";
  document.getElementById("p").textContent = tr ? "Kendi altyazından, kendi metninden. Reklam yok, can yok." : "From your own subtitles and texts. No ads, no hearts.";
  var s = document.getElementById("s"), m = document.createElement("mark");
  if (tr) { s.append("Don't ", m, ". Say it out loud."); m.textContent = "whisper"; document.getElementById("t").textContent = "whisper = fısıldamak"; }
  else { s.append("Es un ", m, " entre los dos."); m.textContent = "secreto"; document.getElementById("t").textContent = "secreto = secret"; }
</script>
