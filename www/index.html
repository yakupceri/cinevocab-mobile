<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CineVocab</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
  <header class="top">
    <img src="logo.png" alt="">
    <b>CineVocab</b>
    <span class="pill" id="streak" hidden><span aria-hidden="true">🔥</span><span id="streakN">0</span></span>
  </header>

  <main>
    <!-- Giris / kayit -->
    <section id="v-auth" hidden>
      <h1 data-i="authH"></h1>
      <p class="sub" data-i="authSub"></p>
      <div class="card">
        <div class="seg" id="authSeg">
          <button type="button" id="segLogin" aria-pressed="true" data-i="login"></button>
          <button type="button" id="segReg" aria-pressed="false" data-i="register"></button>
        </div>
        <form id="authForm">
          <div class="field"><label for="aUser" data-i="username"></label>
            <input id="aUser" autocomplete="username" autocapitalize="none" spellcheck="false"></div>
          <div class="field" id="aMailRow" hidden><label for="aMail" data-i="email"></label>
            <input id="aMail" type="email" autocomplete="email" autocapitalize="none"></div>
          <div class="field"><label for="aPass" data-i="password"></label>
            <input id="aPass" type="password" autocomplete="current-password"></div>
          <button class="btn" id="aGo" type="submit"></button>
        </form>
        <form id="codeForm" hidden>
          <p class="sub" id="codeSub"></p>
          <input id="aCode" inputmode="numeric" maxlength="6" placeholder="000000" autocomplete="one-time-code">
          <button class="btn" type="submit" data-i="verify"></button>
          <button class="link" type="button" id="codeBack" data-i="back"></button>
        </form>
        <div id="recBox" hidden>
          <p class="sub" data-i="recText"></p>
          <code class="code" id="recCode"></code>
          <button class="btn" type="button" id="recOk" data-i="recOk"></button>
        </div>
        <p class="note" id="aMsg"></p>
      </div>
    </section>

    <!-- 1. sekme: videodan kelime cikar -->
    <section id="v-video" hidden>
      <h1 data-i="videoH"></h1>
      <p class="sub" data-i="videoSub"></p>

      <div class="card">
        <div class="lang">
          <div><label for="src" data-i="srcLbl"></label><select id="src"></select></div>
          <button class="swap" id="swap" type="button" data-i-aria="swap">⇄</button>
          <div><label for="dst" data-i="dstLbl"></label><select id="dst"></select></div>
        </div>
      </div>

      <div class="card">
        <label for="link" data-i="linkLbl"></label>
        <input id="link" type="url" inputmode="url" placeholder="https://www.youtube.com/watch?v=..." autocomplete="off" autocapitalize="none">
        <div class="field">
          <label for="count" data-i="countLbl"></label>
          <select id="count"><option>25</option><option selected>50</option><option>100</option></select>
        </div>
        <button class="btn" id="go" type="button" data-i="extract"></button>
        <p class="note" id="msg"></p>
      </div>

      <div class="card" id="plan" hidden>
        <h2 id="planTitle"></h2>
        <p class="sub" id="planSum"></p>
        <div class="chips" id="planWords"></div>
        <p class="note" data-i="tapRemove"></p>
        <button class="btn" id="addBtn" type="button"></button>
        <div class="bar" id="addBar" hidden><i id="addFill"></i></div>
        <p class="note" id="addMsg"></p>
      </div>
    </section>

    <!-- 2. sekme: kelimeler -->
    <section id="v-words" hidden>
      <h1 data-i="wordsH"></h1>
      <p class="sub" id="wordsSub"></p>
      <input id="wq" type="search" data-i-ph="search" autocomplete="off">
      <ul class="wl" id="wl"></ul>
      <button class="btn ghost" id="wMore" type="button" hidden data-i="more"></button>
      <p class="empty" id="wEmpty" hidden></p>
    </section>

    <!-- 3. sekme: pratik -->
    <section id="v-practice" hidden>
      <div id="pIntro">
        <h1 data-i="pracH"></h1>
        <p class="sub" data-i="pracSub"></p>
        <div class="stats">
          <div class="stat hot"><b id="pDue">0</b><span data-i="due"></span></div>
          <div class="stat"><b id="pNew">0</b><span data-i="newW"></span></div>
          <div class="stat"><b id="pMast">0</b><span data-i="mastered"></span></div>
        </div>
        <button class="btn" id="pStart" type="button" data-i="start"></button>
        <p class="note" id="pMsg"></p>
      </div>
      <div id="pQuiz" hidden>
        <div class="bar"><i id="pFill"></i></div>
        <p class="qn" id="pCount"></p>
        <div class="qword" id="pWord"></div>
        <div class="opts" id="pOpts"></div>
      </div>
      <div id="pDone" hidden>
        <div class="card center">
          <div class="big" id="pScore"></div>
          <p class="sub" id="pXp"></p>
          <button class="btn" id="pAgain" type="button" data-i="again"></button>
        </div>
      </div>
    </section>

    <!-- 4. sekme: ben -->
    <section id="v-me" hidden>
      <h1 id="meName"></h1>
      <p class="sub" id="meLevel"></p>
      <div class="stats">
        <div class="stat hot"><b id="meStreak">0</b><span data-i="streak"></span></div>
        <div class="stat"><b id="meWords">0</b><span data-i="wordsN"></span></div>
        <div class="stat"><b id="meXp">0</b><span>XP</span></div>
      </div>
      <div class="card">
        <label for="uiLang" data-i="appLang"></label>
        <select id="uiLang"><option value="en">English</option><option value="tr">Türkçe</option></select>
      </div>
      <div class="card">
        <p class="sub" data-i="siteText"></p>
        <a class="btn ghost" href="https://cinevocab.up.railway.app/" target="_blank" rel="noopener" data-i="openSite"></a>
      </div>
      <button class="btn ghost" id="logout" type="button" data-i="logout"></button>
    </section>
  </main>

  <nav id="tabs" hidden>
    <button type="button" data-view="v-video">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="13" rx="3"/><path d="M10 9l5 2.5-5 2.5z"/></svg><span data-i="tabVideo"></span></button>
    <button type="button" data-view="v-words">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h3"/></svg><span data-i="tabWords"></span></button>
    <button type="button" data-view="v-practice">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 3L5 13h6l-1 8 8-10h-6z"/></svg><span data-i="tabPractice"></span></button>
    <button type="button" data-view="v-me">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 5-5 8-5s6.5 1 8 5"/></svg><span data-i="tabMe"></span></button>
  </nav>

  <div class="toast" id="toast" hidden></div>

  <script src="lang.js"></script>
  <script src="yt.js"></script>
  <script src="app.js"></script>
</body>
</html>
